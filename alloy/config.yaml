name: Grafana Alloy (Logarchief)
version: "1.1.0"
slug: alloy
description: >-
  Stuurt het volledige HAOS-journal (host, Supervisor, Core, elke add-on) naar het
  Logarchief (VictoriaLogs) via de Loki-push-API, in het schema host/unit van ADR 0005.
  Fork van ecohash-co/ha-addon-alloy met Alloy v1.18.1.
url: https://github.com/S4nderr/ha-addon-alloy
codeowners:
  - "@S4nderr"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
journald: true
map:
  - addon_config:rw
ports:
  12345/tcp: null
ports_description:
  12345/tcp: "Alloy debug-UI (standaard dicht; alleen openen bij het zoeken naar een fout)"
watchdog: "http://[HOST]:[PORT:12345]/-/ready"
options:
  loki_url: "http://192.168.2.51:9428/insert/loki/api/v1/push"
  host: "ha"
  max_age: "720h"
  log_level: info
schema:
  loki_url: url
  host: "match(^[a-zA-Z0-9_-]+$)"
  max_age: "match(^[0-9]+[hm]$)"
  log_level: "list(debug|info|warn|error)"
  additional_config: "str?"
stage: experimental
apparmor: false
